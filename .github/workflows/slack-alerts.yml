# Alertas de push e de falha de pipeline no Slack (#github-oraex) e no Teams (canal github-oraex,
# equipe ORAEX - Tech). Equivalente aos service hooks do Azure DevOps, migrado em 2026-10-13.
# Destinos: secrets de repositório SLACK_WEBHOOK_URL e TEAMS_WEBHOOK_URL (plano Free: secret de
# org não chega a repo privado). Sem um dos secrets, o alerta sai só no outro destino.
# Cartões montados com jq a partir de $GITHUB_EVENT_PATH: nada do evento é interpolado no shell.
#
# Cartão padronizado, igual em todo repositório e em todo evento:
#   cabeçalho: EVENTO · DESTINO [· PRECISA DE APROVAÇÃO]
#     EVENTO: MERGE DO PR #N, PUSH DE N COMMITS, MERGE DE BRANCH, TAG CRIADA, BRANCH CRIADA
#     DESTINO: BRANCH PADRÃO, BRANCH DE TRABALHO ou TAG
#   linhas fixas: Repositório, Branch, Área, Aprovação, Autor; depois os commits e os links.
# Merge da branch padrão para dentro de uma branch de trabalho não gera alerta. Remoção de
# branch também não: o GitHub não roda workflow de push quando a referência é apagada.
#
# Área: o workflow lê os arquivos de cada commit pela API (por isso contents: read). Sem a
# variável de repositório ALERTAS_AREAS a área é a pasta (dois níveis). Com ela, vale o nome do
# maior prefixo que casa com o arquivo. Formato da variável (JSON):
#   {"aprovacao": {"nome": "oraex-aprovacao", "url": "https://..."},
#    "areas": [{"prefixo": "admin/k8s/prod", "nome": "Admin produção", "aprovacao": "Admin"}]}
# "aprovacao" na área diz que mexer ali, na branch padrão, passa pela aprovação de produção.
# Uma lista simples de áreas (sem "aprovacao") também é aceita.
# Os programas jq ficam entre aspas simples do shell: não usar apóstrofo dentro deles.
name: Alertas Slack e Teams

on:
  push:
    branches: ["**"]
    tags: ["**"]

permissions: {}

jobs:
  push:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Notificar push
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          ALERTAS_AREAS: ${{ vars.ALERTAS_AREAS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          alerta="$RUNNER_TEMP/alerta.json"
          arquivos="$RUNNER_TEMP/arquivos.json"
          programa='
            def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
            def titulo: split("\n")[0] | if length > 140 then .[0:137] + "…" else . end;
            # "(#159)" no título vira link para o PR (só no Slack).
            def prs($base): gsub("\\(#(?<n>[0-9]+)\\)"; "(<\($base)/pull/\(.n)|#\(.n)>)");
            # Merge da branch padrão para dentro de outra branch (git merge, "Update branch" do
            # GitHub ou "Merge de master em ..."): não traz trabalho novo da branch.
            def sincroniza($padrao):
              ([titulo | capture("^Merge (?:de |branch \\W?|remote-tracking branch \\W?(?:origin/)?)(?<b>[^\\s\\x27\"]+)")] | first) as $m
              | $m != null and $m.b == $padrao;
            # Área de um arquivo: a entrada de ALERTAS_AREAS com o maior prefixo que casa.
            def area_de($areas): . as $f
              | ([$areas[] | select(.prefixo as $p | $f == $p or ($f | startswith($p + "/")))] | sort_by(.prefixo | length) | last);
            # Sem entrada, o nome é a pasta com até dois níveis; arquivo solto na raiz vira "raiz".
            def nome_area($areas): . as $f | ($f | area_de($areas)) as $m
              | if $m then $m.nome
                else ($f | split("/") | if length == 1 then "raiz" else .[0:([length - 1, 2] | min)] | join("/") end) end;
            # Peças do cartão do Teams (Adaptive Card). Texto vindo do evento vai sempre em TextRun,
            # que não interpreta markdown.
            def run($t): {type: "TextRun", text: $t};
            def link($t; $u): {type: "TextRun", text: $t, selectAction: {type: "Action.OpenUrl", url: $u}};
            def rtb($inl): {type: "RichTextBlock", inlines: ($inl | map(select(.text != "")))};
            def linha($rotulo; $inl): {type: "ColumnSet", spacing: "Small", columns: [
              {type: "Column", width: "96px", items: [rtb([run($rotulo) + {isSubtle: true}])]},
              {type: "Column", width: "stretch", items: [rtb($inl)]}]};
            def botao($t; $u): {type: "Action.OpenUrl", title: $t, url: $u};

            .repository as $repo
            | (.ref | sub("^refs/(heads|tags)/"; "")) as $ref
            | (.ref | startswith("refs/tags/")) as $tag
            | (if $tag then "tag" else "branch" end) as $tipo
            | (($tag | not) and $ref == $repo.default_branch) as $principal
            # Só commits novos no repositório: num merge de PR os commits da branch já foram
            # anunciados no push dela (distinct=false); só o commit de merge é novidade.
            | [(.commits // [])[] | select(.distinct)] as $novos
            | (if ($novos | length) > 0 then $novos
               elif .head_commit and (.deleted | not) and (.created | not) then [.head_commit]
               else [] end) as $todos
            | (if $principal or $tag then $todos
               else [$todos[] | select(.message | sincroniza($repo.default_branch) | not)] end) as $commits
            | ($commits | length) as $n
            | (if .deleted then "vazio"
               elif $n > 0 then "commits"
               elif ($todos | length) > 0 then "sincronizacao"
               elif .created then "criada"
               else "vazio" end) as $caso
            | if $modo == "shas" then
                # Commits cujos arquivos o passo busca na API (os 10 mais recentes do push).
                (if $caso == "commits" and ($tag | not) then $commits[-10:][].id | select(test("^[0-9a-f]{40}$")) else empty end)
              elif $caso == "sincronizacao" or $caso == "vazio" then null else
                (if $caso == "criada" and $tag and .head_commit then [.head_commit] else $commits end) as $mostrar
                | ($mostrar | length) as $total
                | (.sender.login // .pusher.name) as $autor
                # Configuração do repositório: nomes de área e, se houver, a aprovação de produção.
                | ($mapa | if . == "" then null else (try fromjson catch null) end) as $bruto
                | (if ($bruto | type) == "array" then {areas: $bruto} elif ($bruto | type) == "object" then $bruto else {} end) as $cfg
                | [($cfg.areas // [])[] | select(.prefixo and .nome)] as $nomes
                | (if (($cfg.aprovacao // {}) | .url // "") != "" then $cfg.aprovacao else null end) as $gate
                # O que mudou: arquivos dos commits (lidos pela API) agrupados por área.
                | ([$arq[][]] | unique) as $fs
                | ($fs | map(nome_area($nomes)) | group_by(.) | map({nome: .[0], n: length}) | sort_by(-.n)) as $areas
                | (if ($areas | length) == 0 then "—"
                   else ($areas[0:3] | map(.nome) | join(" · "))
                        + (if ($areas | length) > 3 then " e mais \(($areas | length) - 3)" else "" end) end) as $areas_txt
                | ([$fs[] | area_de($nomes) | (.aprovacao? // empty)] | unique) as $aprov
                # Que evento é: merge de PR, merge de branch ou push comum.
                | (if $total > 0 then ($mostrar[-1].message | titulo) else "" end) as $ultimo
                | (([$ultimo | capture("\\(#(?<n>[0-9]+)\\)\\s*$")] | first | .n?)
                   // ([$ultimo | capture("^Merge pull request #(?<n>[0-9]+)")] | first | .n?)) as $pr
                | ($caso == "commits" and $pr == null and ([$mostrar[] | .message | titulo | test("^Merge ")] | all)) as $so_merge
                | (if $caso == "criada" then (if $tag then "TAG CRIADA" else "BRANCH CRIADA" end)
                   elif $pr then "MERGE DO PR #\($pr)"
                   elif $so_merge then "MERGE DE BRANCH"
                   else "PUSH DE \($n) COMMIT\(if $n == 1 then "" else "S" end)" end) as $evento
                | (if $tag then "TAG" elif $principal then "BRANCH PADRÃO" else "BRANCH DE TRABALHO" end) as $destino
                # Aprovação de produção: só repositório com "aprovacao" configurada.
                | ($gate != null and $principal and ($aprov | length) > 0) as $precisa
                | (if $gate == null then "Não se aplica"
                   elif ($aprov | length) > 0 then
                     (if $principal then "SIM · produção (\($aprov | join(", ")))"
                      else "No merge para \($repo.default_branch) · produção (\($aprov | join(", ")))" end)
                   elif $principal and $caso == "commits" and ($fs | length) == 0 then "Conferir: sem a lista de arquivos"
                   else "Não precisa" end) as $aprov_txt
                | (if $precisa then {cor: "#ECB22E", emoji: ":large_yellow_circle:", uni: "🟡", estilo: "warning"}
                   elif $tag then {cor: "#7C3AED", emoji: ":label:", uni: "🏷️", estilo: "accent"}
                   elif $principal then {cor: "#2EB67D", emoji: ":large_green_circle:", uni: "🟢", estilo: "good"}
                   elif $caso == "criada" then {cor: "#B0B8C1", emoji: ":sparkles:", uni: "✨", estilo: "emphasis"}
                   elif $so_merge then {cor: "#B0B8C1", emoji: ":twisted_rightwards_arrows:", uni: "🔀", estilo: "emphasis"}
                   else {cor: "#B0B8C1", emoji: ":seedling:", uni: "🌱", estilo: "emphasis"} end) as $v
                | ("\($evento) · \($destino)" + (if $precisa then " · PRECISA DE APROVAÇÃO" else "" end)) as $cab
                | (if $tag then "Tag" else "Branch" end) as $rotulo_ref
                | ([{t: "Abrir PR #\($pr)", u: "\($repo.html_url)/pull/\($pr)", se: ($pr != null)},
                    {t: "Ver diff", u: .compare, se: ($caso == "commits")},
                    {t: "Abrir \($tipo)", u: "\($repo.html_url)/tree/\($ref)", se: true},
                    {t: "Abrir aprovação", u: ($gate.url? // ""), se: $precisa}]
                   | map(select(.se))) as $links
                | ([$mostrar[-5:][] | "<\(.url)|\(.id[0:7])>  \(.message | titulo | esc | prs($repo.html_url))  _\(.author.name | esc)_"]
                   + (if $total > 5 then ["_… e mais \($total - 5)_"] else [] end) | join("\n")) as $lista
                | (if ($fs | length) > 5 then " e mais \(($fs | length) - 5)" else "" end) as $fs_resto
                | {
                    slack: {
                      attachments: [{
                        color: $v.cor,
                        fallback: "\($repo.full_name): \($cab) · \($ref) · \($autor)",
                        blocks: (
                          [{type: "section", text: {type: "mrkdwn", text: "\($v.emoji) *\($cab)*"}},
                           {type: "section", fields: [
                             {type: "mrkdwn", text: "*Repositório*\n<\($repo.html_url)|\($repo.full_name)>"},
                             {type: "mrkdwn", text: "*\($rotulo_ref)*\n`\($ref | esc)`"},
                             {type: "mrkdwn", text: "*Área*\n\($areas_txt | esc)"},
                             {type: "mrkdwn", text: "*Aprovação*\n\($aprov_txt | esc)"},
                             {type: "mrkdwn", text: "*Autor*\n\($autor)"},
                             {type: "mrkdwn", text: "*Commits*\n\($n)"}
                           ]}]
                          + (if $lista == "" then [] else [{type: "section", text: {type: "mrkdwn", text: $lista}}] end)
                          + (if $principal and ($fs | length) > 0 then [{type: "context", elements: [{type: "mrkdwn", text: (
                              ":page_facing_up: " + ($fs[0:5] | map("`\(. | esc)`") | join("  ")) + (if $fs_resto == "" then "" else "  _\($fs_resto | ltrimstr(" "))_" end))}]}] else [] end)
                          + [{type: "context", elements: [{type: "mrkdwn", text: ($links | map("<\(.u)|\(.t)>") | join("  ·  "))}]}]
                        )
                      }]
                    },
                    teams: {
                      type: "message",
                      attachments: [{
                        contentType: "application/vnd.microsoft.card.adaptive",
                        contentUrl: null,
                        content: {
                          "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                          type: "AdaptiveCard",
                          version: "1.4",
                          msteams: {width: "Full"},
                          body: (
                            [{type: "Container", style: $v.estilo, bleed: true, items: [rtb([run("\($v.uni)  \($cab)") + {weight: "Bolder"}])]},
                             linha("Repositório"; [link($repo.full_name; $repo.html_url) + {weight: "Bolder"}]),
                             linha($rotulo_ref; [run($ref) + {weight: "Bolder"}]),
                             linha("Área"; [run($areas_txt)]),
                             linha("Aprovação"; [run($aprov_txt) + (if $precisa then {weight: "Bolder", color: "Attention"} else {} end)]),
                             linha("Autor"; [run($autor)])]
                            + ([$mostrar[-5:][] | rtb([link(.id[0:7]; .url), run("   \(.message | titulo)"), run("   \(.author.name)") + {isSubtle: true}]) + {spacing: "Small"}]
                               | if length > 0 then (.[0] += {separator: true, spacing: "Medium"}) else . end)
                            + (if $total > 5 then [rtb([run("… e mais \($total - 5)") + {isSubtle: true}]) + {spacing: "Small"}] else [] end)
                            + (if $principal and ($fs | length) > 0 then [rtb([run("Arquivos: " + ($fs[0:5] | join(", ")) + $fs_resto) + {isSubtle: true, size: "Small"}]) + {spacing: "Small"}] else [] end)
                          ),
                          actions: ($links | map(botao(.t; .u)))
                        }
                      }]
                    }
                  }
              end
          '
          # Arquivos de cada commit avisado, pela API. Falha aqui não segura o alerta: o cartão
          # sai sem a área.
          : > "$arquivos"
          for sha in $(jq -r --arg modo shas --arg mapa "" --slurpfile arq "$arquivos" "$programa" "$GITHUB_EVENT_PATH"); do
            curl -fsS --retry 2 --max-time 15 -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$sha" | jq -c "[.files[]?.filename]" >> "$arquivos" \
              || echo "::warning::sem a lista de arquivos do commit $sha; o cartão sai sem a área"
          done
          jq -c --arg modo cartao --arg mapa "$ALERTAS_AREAS" --slurpfile arq "$arquivos" "$programa" "$GITHUB_EVENT_PATH" > "$alerta"
          if [ "$(cat "$alerta")" = null ]; then
            echo "Push sem novidade para avisar: só merge da branch padrão, remoção ou nenhum commit novo."
            exit 0
          fi
          enviar() { # enviar <destino> <chave do cartão> <endereço>
            [ -n "$3" ] || { echo "$1: sem secret de destino neste repositório; pulado"; return 0; }
            if jq -c ".$2" "$alerta" | curl -fsS --retry 2 --max-time 20 -o /dev/null -X POST -H "Content-Type: application/json" --data @- "$3"; then
              echo "$1: entregue"
            else
              echo "::error::$1: falha na entrega do alerta"
              return 1
            fi
          }
          rc=0
          enviar Slack slack "$SLACK_WEBHOOK_URL" || rc=1
          enviar Teams teams "$TEAMS_WEBHOOK_URL" || rc=1
          [ -n "$SLACK_WEBHOOK_URL$TEAMS_WEBHOOK_URL" ] || { echo "::error::nenhum destino configurado (SLACK_WEBHOOK_URL ou TEAMS_WEBHOOK_URL)"; rc=1; }
          exit "$rc"

  falha:
    if: github.event_name == 'workflow_run' && contains(fromJSON('["failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Notificar pipeline com falha
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          alerta="$RUNNER_TEMP/alerta.json"
          jq -c '
            def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
            def titulo: split("\n")[0] | if length > 140 then .[0:137] + "…" else . end;
            def run($t): {type: "TextRun", text: $t};
            def link($t; $u): {type: "TextRun", text: $t, selectAction: {type: "Action.OpenUrl", url: $u}};
            def rtb($inl): {type: "RichTextBlock", inlines: ($inl | map(select(.text != "")))};
            def linha($rotulo; $inl): {type: "ColumnSet", spacing: "Small", columns: [
              {type: "Column", width: "96px", items: [rtb([run($rotulo) + {isSubtle: true}])]},
              {type: "Column", width: "stretch", items: [rtb($inl)]}]};

            .workflow_run as $r
            | .repository as $repo
            | ((($r.updated_at | fromdateiso8601) - ($r.run_started_at | fromdateiso8601)) as $s | "\($s / 60 | floor)m\($s % 60)s") as $duracao
            | ($r.triggering_actor.login // $r.actor.login) as $autor
            | ($r.head_branch // "sem branch") as $branch
            | ($r.head_commit.message // "" | titulo) as $mensagem
            | "\($repo.html_url)/commit/\($r.head_sha)" as $url_commit
            | (if $branch == $repo.default_branch then "BRANCH PADRÃO" else "BRANCH DE TRABALHO" end) as $destino
            | "FALHA DE PIPELINE · \($destino)" as $cab
            | {
                slack: {
                  attachments: [{
                    color: "#E01E5A",
                    fallback: "\($repo.full_name): \($cab) · \($r.name) (\($branch))",
                    blocks: [
                      {type: "section", text: {type: "mrkdwn", text: ":x: *\($cab)*"}},
                      {type: "section", fields: [
                        {type: "mrkdwn", text: "*Repositório*\n<\($repo.html_url)|\($repo.full_name)>"},
                        {type: "mrkdwn", text: "*Branch*\n`\($branch | esc)`"},
                        {type: "mrkdwn", text: "*Pipeline*\n<\($r.html_url)|\($r.name | esc) #\($r.run_number)>"},
                        {type: "mrkdwn", text: "*Resultado*\n`\($r.conclusion)` em \($duracao)"},
                        {type: "mrkdwn", text: "*Autor*\n\($autor)"},
                        {type: "mrkdwn", text: "*Gatilho*\n`\($r.event)`"}
                      ]},
                      {type: "section", text: {type: "mrkdwn", text: "<\($url_commit)|\($r.head_sha[0:7])>  \($mensagem | esc)"}},
                      {type: "context", elements: [{type: "mrkdwn", text: "<\($r.html_url)|Abrir logs>  ·  <\($url_commit)|Ver commit>"}]}
                    ]
                  }]
                },
                teams: {
                  type: "message",
                  attachments: [{
                    contentType: "application/vnd.microsoft.card.adaptive",
                    contentUrl: null,
                    content: {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      type: "AdaptiveCard",
                      version: "1.4",
                      msteams: {width: "Full"},
                      body: [
                        {type: "Container", style: "attention", bleed: true, items: [rtb([run("❌  \($cab)") + {weight: "Bolder"}])]},
                        linha("Repositório"; [link($repo.full_name; $repo.html_url) + {weight: "Bolder"}]),
                        linha("Branch"; [run($branch) + {weight: "Bolder"}]),
                        linha("Pipeline"; [link("\($r.name) #\($r.run_number)"; $r.html_url)]),
                        linha("Resultado"; [run("\($r.conclusion) em \($duracao)") + {weight: "Bolder", color: "Attention"}]),
                        linha("Gatilho"; [run($r.event)]),
                        linha("Autor"; [run($autor)]),
                        (rtb([link($r.head_sha[0:7]; $url_commit), run("   \($mensagem)")]) + {separator: true, spacing: "Medium"})
                      ],
                      actions: [{type: "Action.OpenUrl", title: "Abrir logs", url: $r.html_url}, {type: "Action.OpenUrl", title: "Ver commit", url: $url_commit}]
                    }
                  }]
                }
              }
          ' "$GITHUB_EVENT_PATH" > "$alerta"
          enviar() { # enviar <destino> <chave do cartão> <endereço>
            [ -n "$3" ] || { echo "$1: sem secret de destino neste repositório; pulado"; return 0; }
            if jq -c ".$2" "$alerta" | curl -fsS --retry 2 --max-time 20 -o /dev/null -X POST -H "Content-Type: application/json" --data @- "$3"; then
              echo "$1: entregue"
            else
              echo "::error::$1: falha na entrega do alerta"
              return 1
            fi
          }
          rc=0
          enviar Slack slack "$SLACK_WEBHOOK_URL" || rc=1
          enviar Teams teams "$TEAMS_WEBHOOK_URL" || rc=1
          [ -n "$SLACK_WEBHOOK_URL$TEAMS_WEBHOOK_URL" ] || { echo "::error::nenhum destino configurado (SLACK_WEBHOOK_URL ou TEAMS_WEBHOOK_URL)"; rc=1; }
          exit "$rc"
