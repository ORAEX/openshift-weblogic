# Alertas de push e de falha de pipeline no Slack (#github-oraex) e no Teams (canal github-oraex,
# equipe ORAEX - Tech). Equivalente aos service hooks do Azure DevOps, migrado em 2026-10-13.
# Destinos: secrets de repositório SLACK_WEBHOOK_URL e TEAMS_WEBHOOK_URL (plano Free: secret de
# org não chega a repo privado). Sem um dos secrets, o alerta sai só no outro destino.
# Cartões montados com jq a partir de $GITHUB_EVENT_PATH: nada do evento é interpolado no shell.
# Tipos de cartão de push: branch padrão (verde, destaque), tag (roxo, destaque), branch de
# trabalho (cinza, compacto), criação e remoção (uma linha). Merge da branch padrão para dentro
# de uma branch de trabalho não gera alerta.
# O cartão diz o que mudou: lê os arquivos de cada commit pela API (por isso contents: read) e
# mostra a área. Sem a variável de repositório ALERTAS_AREAS a área é a pasta (dois níveis);
# com ela (JSON [{"prefixo": "admin/k8s/prod", "nome": "Admin produção"}]), o nome do maior
# prefixo que casa com o arquivo.
# Os programas jq ficam entre aspas simples do shell: não usar apóstrofo dentro deles.
name: Alertas Slack e Teams

on:
  push:
    branches: ["**"]
    tags: ["**"]

permissions: {}

jobs:
  push:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Notificar push
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          ALERTAS_AREAS: ${{ vars.ALERTAS_AREAS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          alerta="$RUNNER_TEMP/alerta.json"
          arquivos="$RUNNER_TEMP/arquivos.json"
          programa='
            def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
            def titulo: split("\n")[0] | if length > 140 then .[0:137] + "…" else . end;
            # "(#159)" no título vira link para o PR (só no Slack).
            def prs($base): gsub("\\(#(?<n>[0-9]+)\\)"; "(<\($base)/pull/\(.n)|#\(.n)>)");
            # Merge da branch padrão para dentro de outra branch (git merge, "Update branch" do
            # GitHub ou "Merge de master em ..."): não traz trabalho novo da branch.
            def sincroniza($padrao):
              ([titulo | capture("^Merge (?:de |branch \\W?|remote-tracking branch \\W?(?:origin/)?)(?<b>[^\\s\\x27\"]+)")] | first) as $m
              | $m != null and $m.b == $padrao;
            # Área de um arquivo: nome do maior prefixo de ALERTAS_AREAS que casa; sem isso, a
            # pasta com até dois níveis; arquivo solto na raiz vira "raiz".
            def area($nomes): . as $f
              | ([$nomes[] | select(.prefixo as $p | $f == $p or ($f | startswith($p + "/")))] | sort_by(.prefixo | length) | last) as $m
              | if $m then $m.nome
                else ($f | split("/") | if length == 1 then "raiz" else .[0:([length - 1, 2] | min)] | join("/") end) end;
            # Peças do cartão do Teams (Adaptive Card). Texto vindo do evento vai sempre em TextRun,
            # que não interpreta markdown.
            def run($t): {type: "TextRun", text: $t};
            def link($t; $u): {type: "TextRun", text: $t, selectAction: {type: "Action.OpenUrl", url: $u}};
            def preenchidos: map(select(.text != ""));
            def rtb($inl): {type: "RichTextBlock", inlines: ($inl | preenchidos)};
            def pequeno: map(. + {size: "Small"});
            def coluna($largura; $itens): {type: "Column", width: $largura, verticalContentAlignment: "Center", items: $itens};
            def foto($url; $nome; $px): if $url then [coluna("auto"; [{type: "Image", url: $url, style: "Person", width: $px, altText: $nome}])] else [] end;
            def botao($t; $u): {type: "Action.OpenUrl", title: $t, url: $u};

            .repository as $repo
            | (.ref | sub("^refs/(heads|tags)/"; "")) as $ref
            | (.ref | startswith("refs/tags/")) as $tag
            | (if $tag then "tag" else "branch" end) as $tipo
            | (($tag | not) and $ref == $repo.default_branch) as $principal
            # Só commits novos no repositório: num merge de PR os commits da branch já foram
            # anunciados no push dela (distinct=false); só o commit de merge é novidade.
            | [(.commits // [])[] | select(.distinct)] as $novos
            | (if ($novos | length) > 0 then $novos
               elif .head_commit and (.deleted | not) and (.created | not) then [.head_commit]
               else [] end) as $todos
            | (if $principal or $tag then $todos
               else [$todos[] | select(.message | sincroniza($repo.default_branch) | not)] end) as $commits
            | ($commits | length) as $n
            | (if .deleted then "removida"
               elif $n > 0 then (if $principal then "principal" elif $tag then "tag" else "trabalho" end)
               elif ($todos | length) > 0 then "sincronizacao"
               elif .created then "criada"
               else "vazio" end) as $caso
            | if $modo == "shas" then
                # Commits cujos arquivos o passo busca na API (os 10 mais recentes do push).
                (if $caso == "principal" or $caso == "trabalho" then $commits[-10:][].id | select(test("^[0-9a-f]{40}$")) else empty end)
              elif $caso == "sincronizacao" or $caso == "vazio" then null else
                (if $caso == "principal" then {destaque: true, cor: "#2EB67D", emoji: ":large_green_circle:", uni: "🟢", estilo: "good"}
                 elif $tag and $caso != "removida" then {destaque: true, cor: "#7C3AED", emoji: ":label:", uni: "🏷️", estilo: "accent"}
                 elif $caso == "trabalho" then {destaque: false, cor: "#B0B8C1", emoji: ":seedling:", uni: "🌱"}
                 elif $caso == "criada" then {destaque: false, cor: "#B0B8C1", emoji: ":sparkles:", uni: "✨"}
                 else {destaque: false, cor: "#B0B8C1", emoji: ":wastebasket:", uni: "🗑️"} end) as $v
                | (if $caso == "criada" and $tag and .head_commit then [.head_commit] else $commits end) as $mostrar
                | ($mostrar | length) as $total
                | (if $caso == "removida" or $caso == "criada" then {antes: "\($tipo) ", depois: " \($caso)"}
                   else {antes: "\($n) commit\(if $n == 1 then "" else "s" end) em ", depois: ""} end) as $r
                | (.sender.login // .pusher.name) as $autor
                | "\($repo.html_url)/tree/\($ref)" as $url_ref
                | ([{t: "Ver diff", u: .compare, se: ($caso != "removida" and $caso != "criada")},
                    {t: "Abrir \($tipo)", u: $url_ref, se: ($caso != "removida")}]
                   | map(select(.se))) as $links
                | "\($r.antes)`\($ref | esc)`\($r.depois)" as $resumo
                | ([$mostrar[-5:][] | "<\(.url)|\(.id[0:7])>  \(.message | titulo | esc | prs($repo.html_url))  _\(.author.name | esc)_"]
                   + (if $total > 5 then ["_… e mais \($total - 5)_"] else [] end) | join("\n")) as $lista
                | ($links | map("  ·  <\(.u)|\(.t)>") | join("")) as $links_slack
                | ($links | map([run("  ·  "), link(.t; .u)]) | add // []) as $links_teams
                # O que mudou: arquivos dos commits (lidos pela API) agrupados por área.
                | ($mapa | if . == "" then [] else (try (fromjson | map(select(.prefixo and .nome))) catch []) end) as $nomes
                | ([$arq[][]] | unique) as $fs
                | ($fs | map(area($nomes)) | group_by(.) | map({nome: .[0], n: length}) | sort_by(-.n)) as $areas
                | (($areas[0:3] | map(.nome) | join(" · "))
                   + (if ($areas | length) > 3 then " e mais \(($areas | length) - 3)" else "" end)) as $areas_txt
                | ($areas_txt != "") as $tem
                | (if ($fs | length) > 5 then " e mais \(($fs | length) - 5)" else "" end) as $fs_resto
                | {
                    slack: {
                      attachments: [{
                        color: $v.cor,
                        fallback: ("\($repo.full_name): " + (if $tem then "\($areas_txt) · " else "" end) + "\($autor) · \($r.antes)\($ref)\($r.depois)"),
                        blocks: (if $v.destaque then
                          [{type: "section", text: {type: "mrkdwn", text: (
                              if $tem then "\($v.emoji) *\($areas_txt | esc)*\n*<\($repo.html_url)|\($repo.full_name)>*  ·  *\($resumo)*"
                              else "*<\($repo.html_url)|\($repo.full_name)>*  ·  \($v.emoji) *\($resumo)*" end)}}]
                          + (if $lista == "" then [] else [{type: "section", text: {type: "mrkdwn", text: $lista}}] end)
                          + (if ($fs | length) == 0 then [] else [{type: "context", elements: [{type: "mrkdwn", text: (
                              ":page_facing_up: " + ($fs[0:5] | map("`\(. | esc)`") | join("  ")) + (if $fs_resto == "" then "" else "  _\($fs_resto | ltrimstr(" "))_" end))}]}] end)
                          + [{type: "context", elements: [
                              {type: "image", image_url: .sender.avatar_url, alt_text: $autor},
                              {type: "mrkdwn", text: "*\($autor)*\($links_slack)"}
                            ]}]
                        else
                          # Branch de trabalho: a primeira linha (o que mudou e em qual repositório)
                          # em tamanho normal; commits e autor em texto pequeno. Criação e remoção
                          # ficam em uma linha pequena.
                          ((if $tem then "\($v.emoji) *\($areas_txt | esc)*  ·  *<\($repo.html_url)|\($repo.full_name)>*  ·  \($resumo)"
                            else "*<\($repo.html_url)|\($repo.full_name)>*  ·  \($v.emoji) \($resumo)" end)) as $linha
                          | if $caso == "trabalho" then
                              [{type: "section", text: {type: "mrkdwn", text: $linha}}]
                              + (if $lista == "" then [] else [{type: "context", elements: [{type: "mrkdwn", text: $lista}]}] end)
                              + [{type: "context", elements: [
                                  {type: "image", image_url: .sender.avatar_url, alt_text: $autor},
                                  {type: "mrkdwn", text: "*\($autor)*\($links_slack)"}
                                ]}]
                            else
                              [{type: "context", elements: [
                                  {type: "image", image_url: .sender.avatar_url, alt_text: $autor},
                                  {type: "mrkdwn", text: "\($linha)  ·  \($autor)\($links_slack)"}
                                ]}]
                            end
                        end)
                      }]
                    },
                    teams: {
                      type: "message",
                      attachments: [{
                        contentType: "application/vnd.microsoft.card.adaptive",
                        contentUrl: null,
                        content: ({
                          "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                          type: "AdaptiveCard",
                          version: "1.4",
                          msteams: {width: "Full"},
                          body: (
                            # Evento em uma frase: "master · 2 commits" ou "branch feat/x criada".
                            (run($ref) + {fontType: "Monospace", weight: "Bolder"}) as $ref_run
                            | (if $caso == "removida" or $caso == "criada" then [run("\($tipo) "), $ref_run, run(" \($caso)")]
                               else [$ref_run, run("  ·  \($n) commit\(if $n == 1 then "" else "s" end)")] end) as $evento
                            | (if $v.destaque then {size: "Large"} else {} end) as $tam
                            | (if $tem then [run("\($v.uni)  \($areas_txt)") + {weight: "Bolder"} + $tam]
                               else [run("\($v.uni)  "), link($repo.full_name; $repo.html_url) + {weight: "Bolder"} + $tam] end) as $titulo_teams
                            | ((if $tem then [link($repo.full_name; $repo.html_url), run("  ·  ")] else [] end)
                               + $evento + [run("  ·  \($autor)")] | pequeno) as $sub
                            | ([$mostrar[-5:][] | {type: "ColumnSet", spacing: "Small", columns: [
                                  {type: "Column", width: "auto", items: [rtb([link(.id[0:7]; .url) + {fontType: "Monospace"}] | if $v.destaque then . else pequeno end)]},
                                  {type: "Column", width: "stretch", items: [rtb([run(.message | titulo), run("   \(.author.name)") + {italic: true, isSubtle: true}] | if $v.destaque then . else pequeno end)]}
                                ]}]
                               + (if $total > 5 then [rtb([run("… e mais \($total - 5)") + {isSubtle: true}] | pequeno) + {spacing: "Small"}] else [] end)) as $linhas
                            | if $caso == "criada" and ($tag | not) or $caso == "removida" then
                                # Criação e remoção de branch: uma linha.
                                [{type: "ColumnSet", columns: (foto(.sender.avatar_url; $autor; "24px") + [coluna("stretch"; [rtb(
                                    [link($repo.full_name; $repo.html_url) + {weight: "Bolder"}, run("  ·  \($v.uni) ")] + $evento + [run("  ·  \($autor)")] + $links_teams)])])}]
                              else
                                [{type: "Container", style: (if $v.destaque then $v.estilo else "emphasis" end), bleed: true, items: [
                                    {type: "ColumnSet", columns: (foto(.sender.avatar_url; $autor; (if $v.destaque then "36px" else "28px" end))
                                      + [coluna("stretch"; [rtb($titulo_teams), rtb($sub) + {spacing: "None"}])])}]}]
                                + $linhas
                                + (if $v.destaque and ($fs | length) > 0 then [rtb([run("📄  " + ($fs[0:5] | join("    ")) + $fs_resto) + {size: "Small", isSubtle: true, fontType: "Monospace"}]) + {spacing: "Medium"}] else [] end)
                                + (if $v.destaque then [] else [rtb($links_teams[1:] | pequeno) + {spacing: "Small"}] end)
                              end
                          )
                        }
                        + (if $v.destaque then
                            # Botões só nos cartões em destaque: PR (quando o título termina em "(#N)"), diff e branch ou tag.
                            ((if $total > 0 then ([$mostrar[-1].message | titulo | capture("\\(#(?<n>[0-9]+)\\)\\s*$")] | first | .n?) else null end) as $pr
                             | {actions: ((if $pr then [botao("Abrir PR #\($pr)"; "\($repo.html_url)/pull/\($pr)")] else [] end)
                                          + ($links | map(botao(.t; .u))))})
                           else {} end))
                      }]
                    }
                  }
              end
          '
          # Arquivos de cada commit avisado, pela API. Falha aqui não segura o alerta: o cartão
          # sai sem a área.
          : > "$arquivos"
          for sha in $(jq -r --arg modo shas --arg mapa "" --slurpfile arq "$arquivos" "$programa" "$GITHUB_EVENT_PATH"); do
            curl -fsS --retry 2 --max-time 15 -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$sha" | jq -c "[.files[]?.filename]" >> "$arquivos" \
              || echo "::warning::sem a lista de arquivos do commit $sha; o cartão sai sem a área"
          done
          jq -c --arg modo cartao --arg mapa "$ALERTAS_AREAS" --slurpfile arq "$arquivos" "$programa" "$GITHUB_EVENT_PATH" > "$alerta"
          if [ "$(cat "$alerta")" = null ]; then
            echo "Push sem novidade para avisar: só merge da branch padrão ou nenhum commit novo."
            exit 0
          fi
          enviar() { # enviar <destino> <chave do cartão> <endereço>
            [ -n "$3" ] || { echo "$1: sem secret de destino neste repositório; pulado"; return 0; }
            if jq -c ".$2" "$alerta" | curl -fsS --retry 2 --max-time 20 -o /dev/null -X POST -H "Content-Type: application/json" --data @- "$3"; then
              echo "$1: entregue"
            else
              echo "::error::$1: falha na entrega do alerta"
              return 1
            fi
          }
          rc=0
          enviar Slack slack "$SLACK_WEBHOOK_URL" || rc=1
          enviar Teams teams "$TEAMS_WEBHOOK_URL" || rc=1
          [ -n "$SLACK_WEBHOOK_URL$TEAMS_WEBHOOK_URL" ] || { echo "::error::nenhum destino configurado (SLACK_WEBHOOK_URL ou TEAMS_WEBHOOK_URL)"; rc=1; }
          exit "$rc"

  falha:
    if: github.event_name == 'workflow_run' && contains(fromJSON('["failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Notificar pipeline com falha
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          alerta="$RUNNER_TEMP/alerta.json"
          jq -c '
            def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
            def titulo: split("\n")[0] | if length > 140 then .[0:137] + "…" else . end;
            def run($t): {type: "TextRun", text: $t};
            def link($t; $u): {type: "TextRun", text: $t, selectAction: {type: "Action.OpenUrl", url: $u}};
            def rtb($inl): {type: "RichTextBlock", inlines: $inl};
            def pequeno: map(. + {size: "Small"});
            def coluna($largura; $itens): {type: "Column", width: $largura, verticalContentAlignment: "Center", items: $itens};
            def foto($url; $nome; $px): if $url then [coluna("auto"; [{type: "Image", url: $url, style: "Person", width: $px, altText: $nome}])] else [] end;
            def dado($rotulo; $valor): {type: "Column", width: "auto", spacing: "ExtraLarge", items: [
              rtb([run($rotulo) + {isSubtle: true}] | pequeno), rtb([run($valor) + {weight: "Bolder"}]) + {spacing: "None"}]};

            .workflow_run as $r
            | .repository as $repo
            | ((($r.updated_at | fromdateiso8601) - ($r.run_started_at | fromdateiso8601)) as $s | "\($s / 60 | floor)m\($s % 60)s") as $duracao
            | ($r.triggering_actor.login // $r.actor.login) as $autor
            | ($r.head_branch // "sem branch") as $branch
            | ($r.head_commit.message // "" | titulo) as $mensagem
            | "\($repo.html_url)/commit/\($r.head_sha)" as $url_commit
            | {
                slack: {
                  attachments: [{
                    color: "#E01E5A",
                    fallback: "Pipeline falhou: \($r.name) em \($repo.full_name) (\($branch))",
                    blocks: [
                      {type: "section", text: {type: "mrkdwn", text: ":x: *<\($r.html_url)|\($r.name | esc) #\($r.run_number)>* falhou em *<\($repo.html_url)|\($repo.full_name)>*"}},
                      {type: "section", fields: [
                        {type: "mrkdwn", text: "*Branch*\n`\($branch | esc)`"},
                        {type: "mrkdwn", text: "*Gatilho*\n`\($r.event)`"},
                        {type: "mrkdwn", text: "*Resultado*\n`\($r.conclusion)`"},
                        {type: "mrkdwn", text: "*Duração*\n\($duracao)"}
                      ]},
                      {type: "context", elements: [
                        {type: "image", image_url: ($r.triggering_actor.avatar_url // $r.actor.avatar_url), alt_text: $autor},
                        {type: "mrkdwn", text: "*\($autor)*  ·  <\($url_commit)|\($r.head_sha[0:7])> \($mensagem | esc)  ·  <\($r.html_url)|Abrir logs>"}
                      ]}
                    ]
                  }]
                },
                teams: {
                  type: "message",
                  attachments: [{
                    contentType: "application/vnd.microsoft.card.adaptive",
                    contentUrl: null,
                    content: {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      type: "AdaptiveCard",
                      version: "1.4",
                      msteams: {width: "Full"},
                      body: [
                        {type: "Container", style: "attention", bleed: true, items: [
                          {type: "ColumnSet", columns: (foto(($r.triggering_actor.avatar_url // $r.actor.avatar_url); $autor; "36px")
                            + [coluna("stretch"; [
                                rtb([run("❌  "), link("\($r.name) #\($r.run_number)"; $r.html_url) + {weight: "Bolder", size: "Large"}, run("  falhou") + {weight: "Bolder", size: "Large"}]),
                                rtb([link($repo.full_name; $repo.html_url), run("  ·  "), run($branch) + {fontType: "Monospace", weight: "Bolder"}, run("  ·  \($autor)")] | pequeno) + {spacing: "None"}
                              ])])}]},
                        {type: "ColumnSet", spacing: "Medium", columns: [
                          dado("Resultado"; $r.conclusion), dado("Gatilho"; $r.event), dado("Duração"; $duracao)]},
                        {type: "ColumnSet", spacing: "Medium", columns: [
                          {type: "Column", width: "auto", items: [rtb([link($r.head_sha[0:7]; $url_commit) + {fontType: "Monospace"}])]},
                          {type: "Column", width: "stretch", items: [rtb([run($mensagem)])]}]}
                      ],
                      actions: [{type: "Action.OpenUrl", title: "Abrir logs", url: $r.html_url}, {type: "Action.OpenUrl", title: "Ver commit", url: $url_commit}]
                    }
                  }]
                }
              }
          ' "$GITHUB_EVENT_PATH" > "$alerta"
          enviar() { # enviar <destino> <chave do cartão> <endereço>
            [ -n "$3" ] || { echo "$1: sem secret de destino neste repositório; pulado"; return 0; }
            if jq -c ".$2" "$alerta" | curl -fsS --retry 2 --max-time 20 -o /dev/null -X POST -H "Content-Type: application/json" --data @- "$3"; then
              echo "$1: entregue"
            else
              echo "::error::$1: falha na entrega do alerta"
              return 1
            fi
          }
          rc=0
          enviar Slack slack "$SLACK_WEBHOOK_URL" || rc=1
          enviar Teams teams "$TEAMS_WEBHOOK_URL" || rc=1
          [ -n "$SLACK_WEBHOOK_URL$TEAMS_WEBHOOK_URL" ] || { echo "::error::nenhum destino configurado (SLACK_WEBHOOK_URL ou TEAMS_WEBHOOK_URL)"; rc=1; }
          exit "$rc"
