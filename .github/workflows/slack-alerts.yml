# Alertas de push no Slack e no Teams.
# O cartão é montado em ORAEX/oraex-workflows (.github/workflows/alertas.yml), fixado por SHA.
name: Alertas Slack e Teams

on:
  push:
    branches: ["**"]
    tags: ["**"]

permissions: {}

jobs:
  alertas:
    permissions:
      contents: read
    uses: ORAEX/oraex-workflows/.github/workflows/alertas.yml@f05374d15ab6053d93c96530245f1659c5caa909 # main
    with:
      runner: ${{ vars.ORAEX_RUNNER || 'ubuntu-24.04' }}
      areas: ${{ vars.ALERTAS_AREAS }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
